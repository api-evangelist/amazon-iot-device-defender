aid: amazon-iot-device-defender
name: Amazon IoT Device Defender
description: AWS IoT Device Defender is a security service that lets you continuously audit your IoT configurations to detect
  deviations from security best practices. It also lets you detect abnormal device behavior through ML-based anomaly detection
  and take actions to mitigate security risks.
