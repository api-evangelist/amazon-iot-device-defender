        schema:
          type: integer
          minimum: 1
          maximum: 250
      - name: thingTypeName
        in: query
        required: false
        description: The name of the thing type.
        schema:
          type: string
          pattern: '[a-zA-Z0-9:_-]+'
          minLength: 1
          maxLength: 128
      summary: Amazon IoT Device Defender List Thing Types
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Thing Types
