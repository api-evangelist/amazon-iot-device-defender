security:
- hmac: []
tags:
- name: Custom Metric
paths:
  /custom-metric/{metricName}:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: CreateCustomMetric
      description: 'Use this API to define a Custom Metric published by your devices to Device Defender.


        Requires permission to access the CreateCustomMetric action.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCustomMetricResponse'
        '480':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
        '481':
          description: LimitExceededException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitExceededException'
        '482':
          description: ResourceAlreadyExistsException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceAlreadyExistsException'
        '483':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '484':
          description: InternalFailureException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalFailureException'
      parameters:
      - name: metricName
        in: path
        required: true
        description: ' The name of the custom metric. This will be used in the metric report submitted from the device/thing. The name can''t begin with <code>aws:</code>. You can''t change the name after you define it.'
        schema:
          type: string
          pattern: '[a-zA-Z0-9:_-]+'
          minLength: 1
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - metricType
              - clientRequestToken
              properties:
                displayName:
                  description: ' The friendly name in the console for the custom metric. This name doesn''t have to be unique. Don''t use this name as the metric identifier in the device metric report. You can update the friendly name after you define it.'
                  type: string
                  pattern: '[\p{Graph}\x20]*'
                  maxLength: 128
                metricType:
                  description: <p> The type of the custom metric. </p> <important> <p>The type <code>number</code> only takes a single metric value as an input, but when you submit the metrics value in the DeviceMetrics report, you must pass it as an array with a single value.</p> </important>
                  type: string
                  enum:
                  - string-list
                  - ip-address-list
                  - number-list
                  - number
                tags:
                  description: ' Metadata that can be used to manage the custom metric. '
                  type: array
                  items:
                    $ref: '#/components/schemas/Tag'
                clientRequestToken:
                  description: 'Each custom metric must have a unique client request token. If you try to create a new custom metric that already exists with a different token, an exception occurs. If you omit this value, Amazon Web Services SDKs will automatically generate a unique client request. '
                  type: string
                  pattern: ^[a-zA-Z0-9-_]+$
                  minLength: 1
                  maxLength: 64
      summary: Amazon IoT Device Defender Create Custom Metric
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Custom Metric
    delete:
      operationId: DeleteCustomMetric
      description: 'Deletes a Device Defender detect custom metric.


        Requires permission to access the DeleteCustomMetric action.


        Before you can delete a custom metric, you must first remove the custom metric from all security profiles it''s a part of. The security profile associated with the custom metric can be found using the ListSecurityProfiles API with metricName set to your custom metric name.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCustomMetricResponse'
        '480':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
        '481':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '482':
          description: InternalFailureException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalFailureException'
      parameters:
      - name: metricName
        in: path
        required: true
        description: ' The name of the custom metric. '
        schema:
          type: string
          pattern: '[a-zA-Z0-9:_-]+'
          minLength: 1
          maxLength: 128
      summary: Amazon IoT Device Defender Delete Custom Metric
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Custom Metric
    get:
      operationId: DescribeCustomMetric
      description: 'Gets information about a Device Defender detect custom metric.


        Requires permission to access the DescribeCustomMetric action.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeCustomMetricResponse'
        '480':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
        '481':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '482':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '483':
          description: InternalFailureException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalFailureException'
      parameters:
      - name: metricName
        in: path
        required: true
        description: ' The name of the custom metric. '
        schema:
          type: string
          pattern: '[a-zA-Z0-9:_-]+'
          minLength: 1
          maxLength: 128
      summary: Amazon IoT Device Defender Describe Custom Metric
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Custom Metric
    patch:
      operationId: UpdateCustomMetric
      description: 'Updates a Device Defender detect custom metric.


        Requires permission to access the UpdateCustomMetric action.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCustomMetricResponse'
        '480':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
        '481':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '482':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '483':
          description: InternalFailureException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalFailureException'
      parameters:
      - name: metricName
        in: path
        required: true
        description: ' The name of the custom metric. Cannot be updated. '
        schema:
          type: string
          pattern: '[a-zA-Z0-9:_-]+'
          minLength: 1
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - displayName
              properties:
                displayName:
                  description: ' Field represents a friendly name in the console for the custom metric, it doesn''t have to be unique. Don''t use this name as the metric identifier in the device metric report. Can be updated. '
                  type: string
                  pattern: '[\p{Graph}\x20]*'
                  maxLength: 128
      summary: Amazon IoT Device Defender Update Custom Metric
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Custom Metric
components:
  schemas:
    TagValue:
      type: string
      minLength: 0
      maxLength: 256
    ThrottlingException: {}
    DescribeCustomMetricResponse:
      type: object
      properties:
        metricName:
          allOf:
          - $ref: '#/components/schemas/MetricName'
          - description: ' The name of the custom metric. '
        metricArn:
          allOf:
          - $ref: '#/components/schemas/CustomMetricArn'
          - description: ' The Amazon Resource Number (ARN) of the custom metric. '
        metricType:
          allOf:
          - $ref: '#/components/schemas/CustomMetricType'
          - description: <p> The type of the custom metric. </p> <important> <p>The type <code>number</code> only takes a single metric value as an input, but while submitting the metrics value in the DeviceMetrics report, it must be passed as an array with a single value.</p> </important>
        displayName:
          allOf:
          - $ref: '#/components/schemas/CustomMetricDisplayName'
          - description: ' Field represents a friendly name in the console for the custom metric; doesn''t have to be unique. Don''t use this name as the metric identifier in the device metric report. Can be updated. '
        creationDate:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: ' The creation date of the custom metric in milliseconds since epoch. '
        lastModifiedDate:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: ' The time the custom metric was last modified in milliseconds since epoch. '
    TagKey:
      type: string
      pattern: ^([\p{L}\p{Z}\p{N}_.:/=+\-@]*)$
      minLength: 1
      maxLength: 128
    CustomMetricArn:
      type: string
    InvalidRequestException: {}
    ResourceNotFoundException: {}
    ResourceAlreadyExistsException: {}
    Tag:
      type: object
      required:
      - Key
      properties:
        Key:
          allOf:
          - $ref: '#/components/schemas/TagKey'
          - description: The tag's key.
        Value:
          allOf:
          - $ref: '#/components/schemas/TagValue'
          - description: The tag's value.
      description: A set of key/value pairs that are used to manage the resource.
    CustomMetricDisplayName:
      type: string
      pattern: '[\p{Graph}\x20]*'
      maxLength: 128
    DeleteCustomMetricResponse:
      type: object
      properties: {}
    CustomMetricType:
      type: string
      enum:
      - string-list
      - ip-address-list
      - number-list
      - number
    CreateCustomMetricResponse:
      type: object
      properties:
        metricName:
          allOf:
          - $ref: '#/components/schemas/MetricName'
          - description: ' The name of the custom metric to be used in the metric report. '
        metricArn:
          allOf:
          - $ref: '#/components/schemas/CustomMetricArn'
          - description: ' The Amazon Resource Number (ARN) of the custom metric. For example, <code>arn:<i>aws-partition</i>:iot:<i>region</i>:<i>accountId</i>:custommetric/<i>metricName</i> </code> '
    MetricName:
      type: string
      pattern: '[a-zA-Z0-9:_-]+'
      minLength: 1
      maxLength: 128
    UpdateCustomMetricResponse:
      type: object
      properties:
        metricName:
          allOf:
          - $ref: '#/components/schemas/MetricName'
          - description: ' The name of the custom metric. '
        metricArn:
          allOf:
          - $ref: '#/components/schemas/CustomMetricArn'
          - description: ' The Amazon Resource Number (ARN) of the custom metric. '
        metricType:
          allOf:
          - $ref: '#/components/schemas/CustomMetricType'
          - description: <p> The type of the custom metric. </p> <important> <p>The type <code>number</code> only takes a single metric value as an input, but while submitting the metrics value in the DeviceMetrics report, it must be passed as an array with a single value.</p> </important>
        displayName:
          allOf:
          - $ref: '#/components/schemas/CustomMetricDisplayName'
          - description: ' A friendly name in the console for the custom metric '
        creationDate:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: ' The creation date of the custom metric in milliseconds since epoch. '
        lastModifiedDate:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: ' The time the custom metric was last modified in milliseconds since epoch. '
    Timestamp:
      type: string
      format: date-time
    InternalFailureException: {}
    LimitExceededException: {}
  parameters:
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
externalDocs:
  description: Amazon Web Services documentation
  url: https://docs.aws.amazon.com/iot/
x-hasEquivalentPaths: true
