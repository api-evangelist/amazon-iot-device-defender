security:
- hmac: []
tags:
- name: V2 Logging Options
paths:
  /v2LoggingOptions:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    get:
      operationId: GetV2LoggingOptions
      description: 'Gets the fine grained logging options.


        Requires permission to access the GetV2LoggingOptions action.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetV2LoggingOptionsResponse'
        '480':
          description: InternalException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalException'
        '481':
          description: NotConfiguredException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotConfiguredException'
        '482':
          description: ServiceUnavailableException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableException'
      parameters: []
      summary: Amazon IoT Device Defender Get V2 Logging Options
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - V2 Logging Options
    post:
      operationId: SetV2LoggingOptions
      description: 'Sets the logging options for the V2 logging service.


        Requires permission to access the SetV2LoggingOptions action.'
      responses:
        '200':
          description: Success
        '480':
          description: InternalException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalException'
        '481':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
        '482':
          description: ServiceUnavailableException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableException'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roleArn:
                  description: The ARN of the role that allows IoT to write to Cloudwatch logs.
                  type: string
                defaultLogLevel:
                  description: The default logging level.
                  type: string
                  enum:
                  - DEBUG
                  - INFO
                  - ERROR
                  - WARN
                  - DISABLED
                disableAllLogs:
                  description: If true all logs are disabled. The default is false.
                  type: boolean
      summary: Amazon IoT Device Defender Set V2 Logging Options
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - V2 Logging Options
components:
  parameters:
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
  schemas:
    NotConfiguredException: {}
    InternalException: {}
    ServiceUnavailableException: {}
    DisableAllLogs:
      type: boolean
    LogLevel:
      type: string
      enum:
      - DEBUG
      - INFO
      - ERROR
      - WARN
      - DISABLED
    InvalidRequestException: {}
    GetV2LoggingOptionsResponse:
      type: object
      properties:
        roleArn:
          allOf:
          - $ref: '#/components/schemas/AwsArn'
          - description: The IAM role ARN IoT uses to write to your CloudWatch logs.
        defaultLogLevel:
          allOf:
          - $ref: '#/components/schemas/LogLevel'
          - description: The default log level.
        disableAllLogs:
          allOf:
          - $ref: '#/components/schemas/DisableAllLogs'
          - description: Disables all logs.
    AwsArn:
      type: string
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
externalDocs:
  description: Amazon Web Services documentation
  url: https://docs.aws.amazon.com/iot/
x-hasEquivalentPaths: true
