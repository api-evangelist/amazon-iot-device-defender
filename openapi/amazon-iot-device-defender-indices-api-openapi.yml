                  type: string
                  pattern: '[a-zA-Z0-9:_-]+'
                  minLength: 1
                  maxLength: 128
                queryString:
                  description: The query used to search. You can specify "*" for the query string to get the count of all indexed things in your Amazon Web Services account.
                  type: string
                  minLength: 1
                aggregationField:
