components:
  schemas:
    SumOfSquares:
      type: number
      format: double
    Sum:
      type: number
      format: double
    Minimum:
      type: number
      format: double
    ThingConnectivity:
      type: object
      properties:
        connected:
          allOf:
          - $ref: '#/components/schemas/Boolean'
          - description: True if the thing is connected to the Amazon Web Services IoT Core service; false if it is not connected.
        timestamp:
          allOf:
          - $ref: '#/components/schemas/ConnectivityTimestamp'
          - description: The epoch time (in milliseconds) when the thing last connected or disconnected. If the thing has been disconnected for approximately an hour, the time value might be missing.
        disconnectReason:
          allOf:
          - $ref: '#/components/schemas/DisconnectReason'
          - description: The reason why the client is disconnected. If the thing has been disconnected for approximately an hour, the <code>disconnectReason</code> value might be missing.
      description: The connectivity status of the thing.
    ThrottlingException: {}
    ThingGroupDocumentList:
      type: array
      items:
        $ref: '#/components/schemas/ThingGroupDocument'
    MaxBuckets:
      type: integer
      minimum: 1
      maximum: 10000
    ThingGroupId:
      type: string
      pattern: '[a-zA-Z0-9\-]+'
      minLength: 1
      maxLength: 128
    JsonDocument:
      type: string
    AttributeValue:
      type: string
      pattern: '[a-zA-Z0-9_.,@/:#-]*'
      maxLength: 800
    ThingDocumentList:
      type: array
      items:
        $ref: '#/components/schemas/ThingDocument'
    ThingDocument:
      type: object
      properties:
