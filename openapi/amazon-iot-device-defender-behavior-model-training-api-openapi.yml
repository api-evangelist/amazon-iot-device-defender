security:
- hmac: []
tags:
- name: Behavior Model Training
paths:
  /behavior-model-training/summaries:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    get:
      operationId: GetBehaviorModelTrainingSummaries
      description: 'Returns a Device Defender''s ML Detect Security Profile training model''s status.


        Requires permission to access the GetBehaviorModelTrainingSummaries action.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBehaviorModelTrainingSummariesResponse'
        '480':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
        '481':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '482':
          description: InternalFailureException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalFailureException'
        '483':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
      parameters:
      - name: securityProfileName
        in: query
        required: false
        description: ' The name of the security profile. '
        schema:
          type: string
          pattern: '[a-zA-Z0-9:_-]+'
          minLength: 1
          maxLength: 128
      - name: maxResults
        in: query
        required: false
        description: ' The maximum number of results to return at one time. The default is 10. '
        schema:
          type: integer
          minimum: 1
          maximum: 10
      - name: nextToken
        in: query
        required: false
        description: ' The token for the next set of results. '
        schema:
          type: string
      summary: Amazon IoT Device Defender Get Behavior Model Training Summaries
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Behavior Model Training
components:
  schemas:
    BehaviorName:
      type: string
      pattern: '[a-zA-Z0-9:_-]+'
      minLength: 1
      maxLength: 128
    ThrottlingException: {}
    BehaviorModelTrainingSummaries:
      type: array
      items:
        $ref: '#/components/schemas/BehaviorModelTrainingSummary'
    DataCollectionPercentage:
      type: number
      format: double
      minimum: 0
      maximum: 100
    BehaviorModelTrainingSummary:
      type: object
      properties:
        securityProfileName:
          allOf:
          - $ref: '#/components/schemas/SecurityProfileName'
          - description: ' The name of the security profile. '
        behaviorName:
          allOf:
          - $ref: '#/components/schemas/BehaviorName'
          - description: ' The name of the behavior. '
        trainingDataCollectionStartDate:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: ' The date a training model started collecting data. '
        modelStatus:
          allOf:
          - $ref: '#/components/schemas/ModelStatus'
          - description: ' The status of the behavior model. '
        datapointsCollectionPercentage:
          allOf:
          - $ref: '#/components/schemas/DataCollectionPercentage'
          - description: ' The percentage of datapoints collected. '
        lastModelRefreshDate:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: ' The date the model was last refreshed. '
      description: ' The summary of an ML Detect behavior model. '
    ModelStatus:
      type: string
      enum:
      - PENDING_BUILD
      - ACTIVE
      - EXPIRED
    InvalidRequestException: {}
    ResourceNotFoundException: {}
    GetBehaviorModelTrainingSummariesResponse:
      type: object
      properties:
        summaries:
          allOf:
          - $ref: '#/components/schemas/BehaviorModelTrainingSummaries'
          - description: ' A list of all ML Detect behaviors and their model status for a given Security Profile. '
        nextToken:
          allOf:
          - $ref: '#/components/schemas/NextToken'
          - description: ' A token that can be used to retrieve the next set of results, or <code>null</code> if there are no additional results. '
    SecurityProfileName:
      type: string
      pattern: '[a-zA-Z0-9:_-]+'
      minLength: 1
      maxLength: 128
    NextToken:
      type: string
    Timestamp:
      type: string
      format: date-time
    InternalFailureException: {}
  parameters:
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
externalDocs:
  description: Amazon Web Services documentation
  url: https://docs.aws.amazon.com/iot/
x-hasEquivalentPaths: true
