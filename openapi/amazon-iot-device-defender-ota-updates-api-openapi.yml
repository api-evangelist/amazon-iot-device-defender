openapi: 3.2.0
info:
  version: 2015-05-28
  x-release: v4
  title: AWS IoT Ota Updates API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
  x-logo:
    url: https://api.apis.guru/v2/cache/logo/https_twitter.com_awscloud_profile_image.png
    backgroundColor: '#FFFFFF'
  termsOfService: https://aws.amazon.com/service-terms/
  contact:
    name: Mike Ralphson
    email: mike.ralphson@gmail.com
    url: https://github.com/mermade/aws2openapi
    x-twitter: PermittedSoc
  license:
    name: Apache 2.0 License
    url: http://www.apache.org/licenses/
  x-providerName: amazonaws.com
  x-serviceName: iot
  x-aws-signingName: iot
  x-origin:
  - contentType: application/json
    url: https://raw.githubusercontent.com/aws/aws-sdk-js/master/apis/iot-2015-05-28.normal.json
    converter:
      url: https://github.com/mermade/aws2openapi
      version: 1.0.0
    x-apisguru-driver: external
  x-apiClientRegistration:
    url: https://portal.aws.amazon.com/gp/aws/developer/registration/index.html?nc2=h_ct
  x-apisguru-categories:
  - cloud
  x-preferred: true
servers:
- url: http://iot.{region}.amazonaws.com
  variables:
    region:
      description: The AWS region
      enum:
      - us-east-1
      - us-east-2
      - us-west-1
      - us-west-2
      - us-gov-west-1
      - us-gov-east-1
      - ca-central-1
      - eu-north-1
      - eu-west-1
      - eu-west-2
      - eu-west-3
      - eu-central-1
      - eu-south-1
      - af-south-1
      - ap-northeast-1
      - ap-northeast-2
      - ap-northeast-3
      - ap-southeast-1
      - ap-southeast-2
      - ap-east-1
      - ap-south-1
      - sa-east-1
      - me-south-1
      default: us-east-1
  description: The AWS IoT multi-region endpoint
- url: https://iot.{region}.amazonaws.com
  variables:
    region:
      description: The AWS region
      enum:
      - us-east-1
      - us-east-2
      - us-west-1
      - us-west-2
      - us-gov-west-1
      - us-gov-east-1
      - ca-central-1
      - eu-north-1
      - eu-west-1
      - eu-west-2
      - eu-west-3
      - eu-central-1
      - eu-south-1
      - af-south-1
      - ap-northeast-1
      - ap-northeast-2
      - ap-northeast-3
      - ap-southeast-1
      - ap-southeast-2
      - ap-east-1
      - ap-south-1
      - sa-east-1
      - me-south-1
      default: us-east-1
  description: The AWS IoT multi-region endpoint
- url: http://iot.{region}.amazonaws.com.cn
  variables:
    region:
      description: The AWS region
      enum:
      - cn-north-1
      - cn-northwest-1
      default: cn-north-1
  description: The AWS IoT endpoint for China (Beijing) and China (Ningxia)
- url: https://iot.{region}.amazonaws.com.cn
  variables:
    region:
      description: The AWS region
      enum:
      - cn-north-1
      - cn-northwest-1
      default: cn-north-1
  description: The AWS IoT endpoint for China (Beijing) and China (Ningxia)
security:
- hmac: []
tags:
- name: OTA Updates
paths:
  /otaUpdates/{otaUpdateId}:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: CreateOTAUpdate
      description: 'Creates an IoT OTA update on a target group of things or groups.


        Requires permission to access the CreateOTAUpdate action.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOTAUpdateResponse'
        '480':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
        '481':
          description: LimitExceededException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitExceededException'
        '482':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '483':
          description: ResourceAlreadyExistsException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceAlreadyExistsException'
        '484':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '485':
          description: UnauthorizedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedException'
        '486':
          description: InternalFailureException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalFailureException'
        '487':
          description: ServiceUnavailableException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableException'
      parameters:
      - name: otaUpdateId
        in: path
        required: true
        description: The ID of the OTA update to be created.
        schema:
          type: string
          pattern: '[a-zA-Z0-9_-]+'
          minLength: 1
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - targets
              - files
              - roleArn
              properties:
                description:
                  description: The description of the OTA update.
                  type: string
                  pattern: '[^\p{C}]+'
                  maxLength: 2028
                targets:
                  description: The devices targeted to receive OTA updates.
                  type: array
                  items:
                    $ref: '#/components/schemas/Target'
                  minItems: 1
                protocols:
                  description: The protocol used to transfer the OTA update image. Valid values are [HTTP], [MQTT], [HTTP, MQTT]. When both HTTP and MQTT are specified, the target device can choose the protocol.
                  type: array
                  items:
                    $ref: '#/components/schemas/Protocol'
                  minItems: 1
                  maxItems: 2
                targetSelection:
                  description: 'Specifies whether the update will continue to run (CONTINUOUS), or will be complete after all the things specified as targets have completed the update (SNAPSHOT). If continuous, the update may also be run on a thing when a change is detected in a target. For example, an update will run on a thing when the thing is added to a target group, even after the update was completed by all things originally in the group. Valid values: CONTINUOUS | SNAPSHOT.'
                  type: string
                  enum:
                  - CONTINUOUS
                  - SNAPSHOT
                awsJobExecutionsRolloutConfig:
                  description: Configuration for the rollout of OTA updates.
                  type: object
                  properties:
                    maximumPerMinute:
                      allOf:
                      - $ref: '#/components/schemas/MaximumPerMinute'
                      - description: The maximum number of OTA update job executions started per minute.
                    exponentialRate:
                      allOf:
                      - $ref: '#/components/schemas/AwsJobExponentialRolloutRate'
                      - description: The rate of increase for a job rollout. This parameter allows you to define an exponential rate increase for a job rollout.
                awsJobPresignedUrlConfig:
                  description: Configuration information for pre-signed URLs. Valid when <code>protocols</code> contains HTTP.
                  type: object
                  properties:
                    expiresInSec:
                      allOf:
                      - $ref: '#/components/schemas/ExpiresInSeconds'
                      - description: How long (in seconds) pre-signed URLs are valid. Valid values are 60 - 3600, the default value is 1800 seconds. Pre-signed URLs are generated when a request for the job document is received.
                awsJobAbortConfig:
                  description: The criteria that determine when and how a job abort takes place.
                  type: object
                  properties:
                    abortCriteriaList:
                      allOf:
                      - $ref: '#/components/schemas/AwsJobAbortCriteriaList'
                      - description: The list of criteria that determine when and how to abort the job.
                awsJobTimeoutConfig:
                  description: Specifies the amount of time each device has to finish its execution of the job. A timer is started when the job execution status is set to <code>IN_PROGRESS</code>. If the job execution status is not set to another terminal state before the timer expires, it will be automatically set to <code>TIMED_OUT</code>.
                  type: object
                  properties:
                    inProgressTimeoutInMinutes:
                      allOf:
                      - $ref: '#/components/schemas/AwsJobTimeoutInProgressTimeoutInMinutes'
                      - description: Specifies the amount of time, in minutes, this device has to finish execution of this job. The timeout interval can be anywhere between 1 minute and 7 days (1 to 10080 minutes). The in progress timer can't be updated and will apply to all job executions for the job. Whenever a job execution remains in the IN_PROGRESS status for longer than this interval, the job execution will fail and switch to the terminal <code>TIMED_OUT</code> status.
                files:
                  description: The files to be streamed by the OTA update.
                  type: array
                  items:
                    $ref: '#/components/schemas/OTAUpdateFile'
                  minItems: 1
                roleArn:
                  description: The IAM role that grants Amazon Web Services IoT Core access to the Amazon S3, IoT jobs and Amazon Web Services Code Signing resources to create an OTA update job.
                  type: string
                  minLength: 20
                  maxLength: 2048
                additionalParameters:
                  description: A list of additional OTA update parameters which are name-value pairs.
                  type: object
                  additionalProperties:
                    $ref: '#/components/schemas/Value'
                tags:
                  description: Metadata which can be used to manage updates.
                  type: array
                  items:
                    $ref: '#/components/schemas/Tag'
      summary: Amazon IoT Device Defender Create O T a Update
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - OTA Updates
    delete:
      operationId: DeleteOTAUpdate
      description: 'Delete an OTA update.


        Requires permission to access the DeleteOTAUpdate action.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteOTAUpdateResponse'
        '480':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
        '481':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '482':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '483':
          description: UnauthorizedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedException'
        '484':
          description: InternalFailureException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalFailureException'
        '485':
          description: ServiceUnavailableException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableException'
        '486':
          description: VersionConflictException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionConflictException'
      parameters:
      - name: otaUpdateId
        in: path
        required: true
        description: The ID of the OTA update to delete.
        schema:
          type: string
          pattern: '[a-zA-Z0-9_-]+'
          minLength: 1
          maxLength: 128
      - name: deleteStream
        in: query
        required: false
        description: When true, the stream created by the OTAUpdate process is deleted when the OTA update is deleted. Ignored if the stream specified in the OTAUpdate is supplied by the user.
        schema:
          type: boolean
      - name: forceDeleteAWSJob
        in: query
        required: false
        description: When true, deletes the IoT job created by the OTAUpdate process even if it is "IN_PROGRESS". Otherwise, if the job is not in a terminal state ("COMPLETED" or "CANCELED") an exception will occur. The default is false.
        schema:
          type: boolean
      summary: Amazon IoT Device Defender Delete O T a Update
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - OTA Updates
    get:
      operationId: GetOTAUpdate
      description: 'Gets an OTA update.


        Requires permission to access the GetOTAUpdate action.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOTAUpdateResponse'
        '480':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
        '481':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '482':
          description: UnauthorizedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedException'
        '483':
          description: InternalFailureException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalFailureException'
        '484':
          description: ServiceUnavailableException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableException'
        '485':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
      parameters:
      - name: otaUpdateId
        in: path
        required: true
        description: The OTA update ID.
        schema:
          type: string
          pattern: '[a-zA-Z0-9_-]+'
          minLength: 1
          maxLength: 128
      summary: Amazon IoT Device Defender Get O T a Update
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - OTA Updates
  /otaUpdates:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    get:
      operationId: ListOTAUpdates
      description: 'Lists OTA updates.


        Requires permission to access the ListOTAUpdates action.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOTAUpdatesResponse'
        '480':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
        '481':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '482':
          description: UnauthorizedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedException'
        '483':
          description: InternalFailureException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalFailureException'
        '484':
          description: ServiceUnavailableException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableException'
      parameters:
      - name: maxResults
        in: query
        required: false
        description: The maximum number of results to return at one time.
        schema:
          type: integer
          minimum: 1
          maximum: 250
      - name: nextToken
        in: query
        required: false
        description: A token used to retrieve the next set of results.
        schema:
          type: string
      - name: otaUpdateStatus
        in: query
        required: false
        description: The OTA update job status.
        schema:
          type: string
          enum:
          - CREATE_PENDING
          - CREATE_IN_PROGRESS
          - CREATE_COMPLETE
          - CREATE_FAILED
          - DELETE_IN_PROGRESS
          - DELETE_FAILED
      summary: Amazon IoT Device Defender List O T a Updates
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - OTA Updates
components:
  schemas:
    TagValue:
      type: string
      minLength: 0
      maxLength: 256
    ListOTAUpdatesResponse:
      type: object
      properties:
        otaUpdates:
          allOf:
          - $ref: '#/components/schemas/OTAUpdatesSummary'
          - description: A list of OTA update jobs.
        nextToken:
          allOf:
          - $ref: '#/components/schemas/NextToken'
          - description: A token to use to get the next set of results.
    AwsIotJobArn:
      type: string
    OTAUpdateSummary:
      type: object
      properties:
        otaUpdateId:
          allOf:
          - $ref: '#/components/schemas/OTAUpdateId'
          - description: The OTA update ID.
        otaUpdateArn:
          allOf:
          - $ref: '#/components/schemas/OTAUpdateArn'
          - description: The OTA update ARN.
        creationDate:
          allOf:
          - $ref: '#/components/schemas/DateType'
          - description: The date when the OTA update was created.
      description: An OTA update summary.
    Targets:
      type: array
      items:
        $ref: '#/components/schemas/Target'
      minItems: 1
    DateType:
      type: string
      format: date-time
    FileId:
      type: integer
      minimum: 0
      maximum: 255
    CreateOTAUpdateResponse:
      type: object
      properties:
        otaUpdateId:
          allOf:
          - $ref: '#/components/schemas/OTAUpdateId'
          - description: The OTA update ID.
        awsIotJobId:
          allOf:
          - $ref: '#/components/schemas/AwsIotJobId'
          - description: The IoT job ID associated with the OTA update.
        otaUpdateArn:
          allOf:
          - $ref: '#/components/schemas/OTAUpdateArn'
          - description: The OTA update ARN.
        awsIotJobArn:
          allOf:
          - $ref: '#/components/schemas/AwsIotJobArn'
          - description: The IoT job ARN associated with the OTA update.
        otaUpdateStatus:
          allOf:
          - $ref: '#/components/schemas/OTAUpdateStatus'
          - description: The OTA update status.
    CertificateName:
      type: string
    FileName:
      type: string
    Stream:
      type: object
      properties:
        streamId:
          allOf:
          - $ref: '#/components/schemas/StreamId'
          - description: The stream ID.
        fileId:
          allOf:
          - $ref: '#/components/schemas/FileId'
          - description: The ID of a file associated with a stream.
      description: Describes a group of files that can be streamed.
    AwsJobExponentialRolloutRate:
      type: object
      required:
      - baseRatePerMinute
      - incrementFactor
      - rateIncreaseCriteria
      properties:
        baseRatePerMinute:
          allOf:
          - $ref: '#/components/schemas/AwsJobRolloutRatePerMinute'
          - description: The minimum number of things that will be notified of a pending job, per minute, at the start of the job rollout. This is the initial rate of the rollout.
        incrementFactor:
          allOf:
          - $ref: '#/components/schemas/AwsJobRolloutIncrementFactor'
          - description: The rate of increase for a job rollout. The number of things notified is multiplied by this factor.
        rateIncreaseCriteria:
          allOf:
          - $ref: '#/components/schemas/AwsJobRateIncreaseCriteria'
          - description: <p>The criteria to initiate the increase in rate of rollout for a job.</p> <p>Amazon Web Services IoT Core supports up to one digit after the decimal (for example, 1.5, but not 1.55).</p>
      description: The rate of increase for a job rollout. This parameter allows you to define an exponential rate increase for a job rollout.
    S3Key:
      type: string
      minLength: 1
    SigningJobId:
      type: string
    AwsJobPresignedUrlConfig:
      type: object
      properties:
        expiresInSec:
          allOf:
          - $ref: '#/components/schemas/ExpiresInSeconds'
          - description: How long (in seconds) pre-signed URLs are valid. Valid values are 60 - 3600, the default value is 1800 seconds. Pre-signed URLs are generated when a request for the job document is received.
      description: Configuration information for pre-signed URLs. Valid when <code>protocols</code> contains HTTP.
    Platform:
      type: string
    AdditionalParameterMap:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/Value'
    S3Location:
      type: object
      properties:
        bucket:
          allOf:
          - $ref: '#/components/schemas/S3Bucket'
          - description: The S3 bucket.
        key:
          allOf:
          - $ref: '#/components/schemas/S3Key'
          - description: The S3 key.
        version:
          allOf:
          - $ref: '#/components/schemas/S3Version'
          - description: The S3 bucket version.
      description: The S3 location.
    AwsJobAbortCriteriaAbortThresholdPercentage:
      type: number
      format: double
      maximum: 100
    UnauthorizedException: {}
    TargetSelection:
      type: string
      enum:
      - CONTINUOUS
      - SNAPSHOT
    AwsJobRateIncreaseCriteria:
      type: object
      properties:
        numberOfNotifiedThings:
          allOf:
          - $ref: '#/components/schemas/AwsJobRateIncreaseCriteriaNumberOfThings'
          - description: When this number of things have been notified, it will initiate an increase in the rollout rate.
        numberOfSucceededThings:
          allOf:
          - $ref: '#/components/schemas/AwsJobRateIncreaseCriteriaNumberOfThings'
          - description: When this number of things have succeeded in their job execution, it will initiate an increase in the rollout rate.
      description: The criteria to initiate the increase in rate of rollout for a job.
    Prefix:
      type: string
    FileType:
      type: integer
      minimum: 0
      maximum: 255
    S3Version:
      type: string
    OTAUpdateFiles:
      type: array
      items:
        $ref: '#/components/schemas/OTAUpdateFile'
      minItems: 1
    CodeSigningSignature:
      type: object
      properties:
        inlineDocument:
          allOf:
          - $ref: '#/components/schemas/Signature'
          - description: A base64 encoded binary representation of the code signing signature.
      description: Describes the signature for a file.
    Target:
      type: string
    AwsJobAbortCriteriaFailureType:
      type: string
      enum:
      - FAILED
      - REJECTED
      - TIMED_OUT
      - ALL
    AwsJobRolloutRatePerMinute:
      type: integer
      minimum: 1
      maximum: 1000
    InlineDocument:
      type: string
    SigningProfileName:
      type: string
    OTAUpdateStatus:
      type: string
      enum:
      - CREATE_PENDING
      - CREATE_IN_PROGRESS
      - CREATE_COMPLETE
      - CREATE_FAILED
      - DELETE_IN_PROGRESS
      - DELETE_FAILED
    OTAUpdateArn:
      type: string
    AttributesMap:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/Value'
    S3Destination:
      type: object
      properties:
        bucket:
          allOf:
          - $ref: '#/components/schemas/S3Bucket'
          - description: The S3 bucket that contains the updated firmware.
        prefix:
          allOf:
          - $ref: '#/components/schemas/Prefix'
          - description: The S3 prefix.
      description: Describes the location of updated firmware in S3.
    ResourceNotFoundException: {}
    FileLocation:
      type: object
      properties:
        stream:
          allOf:
          - $ref: '#/components/schemas/Stream'
          - description: The stream that contains the OTA update.
        s3Location:
          allOf:
          - $ref: '#/components/schemas/S3Location'
          - description: The location of the updated firmware in S3.
      description: The location of the OTA update.
    ServiceUnavailableException: {}
    OTAUpdateErrorMessage:
      type: string
    OTAUpdateInfo:
      type: object
      properties:
        otaUpdateId:
          allOf:
          - $ref: '#/components/schemas/OTAUpdateId'
          - description: The OTA update ID.
        otaUpdateArn:
          allOf:
          - $ref: '#/components/schemas/OTAUpdateArn'
          - description: The OTA update ARN.
        creationDate:
          allOf:
          - $ref: '#/components/schemas/DateType'
          - description: The date when the OTA update was created.
        lastModifiedDate:
          allOf:
          - $ref: '#/components/schemas/DateType'
          - description: The date when the OTA update was last updated.
        description:
          allOf:
          - $ref: '#/components/schemas/OTAUpdateDescription'
          - description: A description of the OTA update.
        targets:
          allOf:
          - $ref: '#/components/schemas/Targets'
          - description: The targets of the OTA update.
        protocols:
          allOf:
          - $ref: '#/components/schemas/Protocols'
          - description: The protocol used to transfer the OTA update image. Valid values are [HTTP], [MQTT], [HTTP, MQTT]. When both HTTP and MQTT are specified, the target device can choose the protocol.
        awsJobExecutionsRolloutConfig:
          allOf:
          - $ref: '#/components/schemas/AwsJobExecutionsRolloutConfig'
          - description: Configuration for the rollout of OTA updates.
        awsJobPresignedUrlConfig:
          allOf:
          - $ref: '#/components/schemas/AwsJobPresignedUrlConfig'
          - description: Configuration information for pre-signed URLs. Valid when <code>protocols</code> contains HTTP.
        targetSelection:
          allOf:
          - $ref: '#/components/schemas/TargetSelection'
