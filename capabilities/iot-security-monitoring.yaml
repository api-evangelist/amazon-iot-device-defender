naftiko: "1.0.0-alpha1"
info:
  label: Amazon IoT Device Defender - Iot Security Monitoring
  description: Unified capability for Security Engineer, IoT Developer to manage security service for iot fleet auditing and anomaly detection operations.
  tags:
    - IoT
    - AWS
    - Security
    - Device Management
    - Compliance
  created: "2026-04-19"
  modified: "2026-04-19"
binds:
  - namespace: env
    keys:
      AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
capability:
  consumes:
    - import: iot-device-defender
      location: ./shared/iot-device-defender.yaml
  exposes:
    - type: rest
      port: 8080
      namespace: iot-security-monitoring-api
      description: Unified REST API for iot security monitoring.
      resources:
        - path: /v1/resources
          name: resources
          description: Amazon IoT Device Defender resources
          operations:
            - method: GET
              name: list-security-profiles
              description: List Security Profiles
              call: "iot-device-defender.list-security-profiles"
              outputParameters:
                - type: object
                  mapping: "$."
    - type: mcp
      port: 9090
      namespace: iot-security-monitoring-mcp
      transport: http
      description: MCP server for AI-assisted iot security monitoring.
      tools:
        - name: list-security-profiles
          description: Amazon IoT Device Defender List Security Profiles
          hints:
            readOnly: true
            openWorld: true
          call: "iot-device-defender.list-security-profiles"
          outputParameters:
            - type: object
              mapping: "$."

        - name: create-security-profile
          description: Amazon IoT Device Defender Create Security Profile
          hints:
            readOnly: false
            
          call: "iot-device-defender.create-security-profile"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-audit-tasks
          description: Amazon IoT Device Defender List Audit Tasks
          hints:
            readOnly: true
            openWorld: true
          call: "iot-device-defender.list-audit-tasks"
          outputParameters:
            - type: object
              mapping: "$."

        - name: start-audit
          description: Amazon IoT Device Defender Start Audit
          hints:
            readOnly: false
            
          call: "iot-device-defender.start-audit"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-violations
          description: Amazon IoT Device Defender List Violations
          hints:
            readOnly: true
            openWorld: true
          call: "iot-device-defender.list-violations"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-detect-mitigations
          description: Amazon IoT Device Defender List Detect Mitigations
          hints:
            readOnly: true
            openWorld: true
          call: "iot-device-defender.list-detect-mitigations"
          outputParameters:
            - type: object
              mapping: "$."

        - name: describe-security-profile
          description: Amazon IoT Device Defender Describe Security Profile
          hints:
            readOnly: true
            openWorld: true
          call: "iot-device-defender.describe-security-profile"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-audit-findings
          description: Amazon IoT Device Defender List Audit Findings
          hints:
            readOnly: true
            openWorld: true
          call: "iot-device-defender.list-audit-findings"
          outputParameters:
            - type: object
              mapping: "$."
