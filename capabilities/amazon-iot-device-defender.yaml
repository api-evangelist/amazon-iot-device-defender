naftiko: 1.0.0-alpha2
info:
  label: AWS IoT
  description: 'AWS IoT. 238 operations. Lead operation: Amazon IoT Device Defender Accept Certificate Transfer. Self-contained
    Naftiko capability covering one Amazon Iot Device Defender business surface.'
  tags:
  - Amazon Iot Device Defender
  - AWS IoT
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AMAZON_IOT_DEVICE_DEFENDER_API_KEY: AMAZON_IOT_DEVICE_DEFENDER_API_KEY
capability:
  consumes:
  - type: http
    namespace: amazon-iot-device-defender
    baseUri: http://iot.{region}.amazonaws.com
    description: AWS IoT business capability. Self-contained, no shared references.
    resources:
    - name: accept-certificate-transfer-certificateId
      path: /accept-certificate-transfer/{certificateId}
      operations:
      - name: acceptcertificatetransfer
        method: PATCH
        description: Amazon IoT Device Defender Accept Certificate Transfer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: certificateId
          in: path
          type: string
          description: The ID of the certificate. (The last part of the certificate ARN contains the certificate ID.)
          required: true
        - name: setAsActive
          in: query
          type: boolean
          description: Specifies whether the certificate is active.
    - name: active-violations
      path: /active-violations
      operations:
      - name: listactiveviolations
        method: GET
        description: Amazon IoT Device Defender List Active Violations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: thingName
          in: query
          type: string
          description: The name of the thing whose active violations are listed.
        - name: securityProfileName
          in: query
          type: string
          description: The name of the Device Defender security profile for which violations are listed.
        - name: behaviorCriteriaType
          in: query
          type: string
          description: The criteria for a behavior.
        - name: listSuppressedAlerts
          in: query
          type: boolean
          description: A list of all suppressed alerts.
        - name: verificationState
          in: query
          type: string
          description: The verification state of the violation (detect alarm).
        - name: nextToken
          in: query
          type: string
          description: The token for the next set of results.
        - name: maxResults
          in: query
          type: integer
          description: The maximum number of results to return at one time.
    - name: attached-policies-target
      path: /attached-policies/{target}
